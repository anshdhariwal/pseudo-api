<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>pseudo-api demo</title>
  <style>
    body { font-family: sans-serif; width: 320px; padding: 16px; }
    textarea { width: 100%; height: 80px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    #response { margin-top: 12px; font-size: 13px; color: #333; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>pseudo-api demo</h3>
  <textarea id="question" placeholder="Ask something..."></textarea>
  <button id="send">Send</button>
  <div id="response"></div>
  <script src="popup.js"></script>
</body>
</html>
