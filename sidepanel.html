<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>pseudo-api</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #eee;
      font-family: sans-serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #111;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .bar span { flex: 1; font-weight: 600; }

    select {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
    }

    button {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover { background: #333; }

    .test-panel {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .test-panel input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      color: #eee;
      padding: 4px 8px;
      font-size: 11px;
    }

    .test-output {
      display: none;
      padding: 6px 10px;
      font-size: 11px;
      color: #a3e635;
      background: #111;
      border-bottom: 1px solid #222;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
      flex-shrink: 0;
    }

    .status {
      padding: 3px 10px;
      font-size: 10px;
      color: #666;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="bar">
    <span>pseudo-api</span>
    <select id="provider">
      <option value="gemini">Gemini</option>
      <option value="claude">Claude</option>
      <option value="chatgpt">ChatGPT</option>
      <option value="gmode">AI Mode</option>
    </select>
    <button id="reload">reload</button>
  </div>

  <div class="test-panel">
    <input type="text" id="test-input" placeholder="Test API prompt...">
    <button id="test-send">Send</button>
  </div>

  <div class="test-output" id="test-output"></div>

  <div class="status" id="status">loading...</div>

  <iframe id="aiframe"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
  </iframe>

  <script src="sidepanel.js"></script>
</body>
</html>
